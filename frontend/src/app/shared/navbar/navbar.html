
<header class="navbar">
  <a routerLink="/" class="marca">♻️ ReUse Campus</a>

  <nav>
    <a routerLink="/" routerLinkActive="activo"
       [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    <a routerLink="/publicaciones" routerLinkActive="activo"
       [routerLinkActiveOptions]="{ exact: true }">
      Publicaciones
    </a>

    @if (auth.autenticado()) {
      <a routerLink="/publicaciones/nueva" routerLinkActive="activo">
        Publicar
      </a>

      <a routerLink="/mis-solicitudes" routerLinkActive="activo">
        Mis solicitudes
      </a>

      <a routerLink="/entregas" routerLinkActive="activo">
        Mis entregas
      </a>

      @if (auth.esAdministrador()) {
        <a routerLink="/admin" routerLinkActive="activo">
          Administración
        </a>
      }
    }
  </nav>

  <div class="usuario-prueba">
    @if (auth.autenticado()) {
      <span>
        {{ auth.usuario()?.nombre }}
        ({{ auth.usuario()?.rol }})
      </span>

      <button type="button" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="activo">
        Iniciar sesión
      </a>
    }
  </div>
</header>
